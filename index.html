<!doctype html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Q版聖騎士｜槍盾街頭突擊 V1</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111827;color:#f8fafc;font-family:system-ui,-apple-system,sans-serif;display:flex;justify-content:center;min-height:100vh;padding:12px}
#game{width:min(100%,900px)}h1{font-size:20px;margin:0 0 10px}
.stage{position:relative;overflow:hidden;border-radius:18px;background:linear-gradient(#8fb3d1 0 53%,#596778 53% 100%);aspect-ratio:16/9;border:1px solid #64748b;touch-action:none}
.sky{position:absolute;inset:0 0 47%;background:linear-gradient(#9fc6df,#d9e4e8)}
.castle{position:absolute;left:0;right:0;bottom:47%;height:31%;background:linear-gradient(90deg,#718093 0 13%,#9aa7b6 13% 25%,#667487 25% 39%,#a5b0bd 39% 54%,#6d7b8e 54% 72%,#a8b2bf 72% 88%,#687689 88%);opacity:.8}
.tower{position:absolute;bottom:47%;width:11%;height:31%;background:#8997a8;border:5px solid #6b7889}.tower:before{content:"";position:absolute;top:-18px;left:-8px;border-left:34px solid transparent;border-right:34px solid transparent;border-bottom:28px solid #5c6878}.t1{left:8%}.t2{right:10%}.t3{left:45%;height:38%;width:9%}
.ground{position:absolute;left:0;right:0;bottom:0;height:47%;background:repeating-linear-gradient(0deg,#4d5b6c 0 34px,#596879 34px 37px);border-top:5px solid #8b98a8}.ground:after{content:"";position:absolute;left:0;right:0;top:34%;height:3px;background:#aab4c0;opacity:.45}
.hud{position:absolute;top:10px;left:10px;right:10px;z-index:20;display:flex;justify-content:space-between;align-items:flex-start;font-weight:800;font-size:12px}.hudbox{background:#172033dd;border:1px solid #7b8798;border-radius:12px;padding:7px 10px}.hpbar{width:145px;height:9px;background:#263044;border-radius:99px;overflow:hidden;margin-top:4px}.hpfill{height:100%;width:100%;background:#e65b5b;transition:width .15s}
.player{position:absolute;z-index:8;width:38px;height:50px;background:#e8eaf0;border:2px solid #8b93a1;border-radius:12px 12px 9px 9px;bottom:18%;transform-origin:center bottom}.player:before{content:"";position:absolute;width:34px;height:34px;background:#f3c9a5;border:2px solid #b98f75;border-radius:50%;left:0;top:-25px}.hair{position:absolute;z-index:9;width:38px;height:25px;left:0;top:-20px;border-radius:50% 50% 45% 45%;background:#f1c77c}.shield{position:absolute;z-index:10;width:27px;height:34px;border-radius:48% 48% 42% 42%;background:#dfe3e9;border:3px solid #9aa3af;left:-25px;top:7px;transform:rotate(7deg)}.shield:after{content:"✦";position:absolute;left:7px;top:6px;color:#d4ae55;font-size:13px}.spear{position:absolute;z-index:10;width:67px;height:5px;background:#b98543;right:-61px;top:23px;transform:rotate(-4deg);border-radius:5px}.spear:after{content:"";position:absolute;right:-13px;top:-7px;border-left:17px solid #e5e8ed;border-top:9px solid transparent;border-bottom:9px solid transparent}.player.thrust{transform:translateX(13px) scaleX(1.08)}.player.bash{transform:translateX(-7px) rotate(-7deg)}
.enemy{position:absolute;z-index:7;width:32px;height:46px;background:#343b49;border:2px solid #222938;border-radius:10px 10px 7px 7px;bottom:18%;transition:transform .08s,opacity .2s}.enemy:before{content:"";position:absolute;width:27px;height:27px;left:1px;top:-20px;background:#303746;border-radius:50%;border:2px solid #202633}.enemy:after{content:"";position:absolute;left:-5px;top:-8px;width:40px;height:10px;background:#495466;border-radius:8px}.enemy.hit{transform:translateX(12px) rotate(8deg)}.enemy.dead{opacity:0;transform:translateY(28px) scale(.7)}.boss{width:48px;height:66px;background:#604b69;border-color:#302638}.boss:before{width:39px;height:39px;top:-29px;left:2px}.boss:after{width:52px;left:-4px}
.float{position:absolute;z-index:30;font-weight:1000;font-size:20px;color:#fff1bd;text-shadow:2px 2px #6b4d18;pointer-events:none;animation:floatUp .45s forwards}@keyframes floatUp{to{transform:translateY(-35px);opacity:0}}
.slash{position:absolute;z-index:15;width:70px;height:70px;border:6px solid #f4d77d;border-left-color:transparent;border-bottom-color:transparent;border-radius:50%;pointer-events:none;animation:slash .22s forwards}@keyframes slash{to{transform:rotate(70deg) scale(1.25);opacity:0}}
.message{position:absolute;z-index:50;inset:0;background:#101827d9;display:flex;align-items:center;justify-content:center;text-align:center;padding:20px}.card{background:#1d293d;border:1px solid #7a8799;border-radius:20px;padding:24px;max-width:350px}.card h2{margin:0 0 7px;font-size:27px}.card p{margin:0 0 17px;color:#cbd5e1}.card button,.ctrl{min-height:44px;border:0;border-radius:12px;padding:10px 17px;background:#eabf63;color:#1a2230;font-weight:900;cursor:pointer}
.controls{display:flex;justify-content:space-between;gap:12px;margin-top:10px}.grp{display:flex;gap:8px}.ctrl{width:50px;height:48px;padding:0;font-size:20px;background:#e2e8f0}.attack{background:#eabf63}.hint{text-align:center;color:#94a3b8;font-size:12px;margin-top:8px}
</style>
</head>
<body>
<div id="game">
<h1>Q版聖騎士｜槍盾街頭突擊 V1</h1>
<div class="stage" id="stage">
<div class="sky"></div><div class="castle"></div><div class="tower t1"></div><div class="tower t2"></div><div class="tower t3"></div><div class="ground"></div>
<div class="hud"><div class="hudbox">聖騎士<div class="hpbar"><div id="hp" class="hpfill"></div></div></div><div id="counter" class="hudbox">敵人 0 / 10</div></div>
<div id="player" class="player"><div class="hair"></div><div class="shield"></div><div class="spear"></div></div><div id="enemies"></div>
<div id="message" class="message"><div class="card"><h2 id="title">Q版聖騎士</h2><p id="desc">槍刺、盾擊，突破城門！<br>擊敗 10 個敵人後挑戰 Boss。</p><button id="start">開始遊戲</button></div></div>
</div>
<div class="controls"><div class="grp"><button class="ctrl" data-key="left">◀</button><button class="ctrl" data-key="jump">▲</button><button class="ctrl" data-key="right">▶</button></div><div class="grp"><button class="ctrl attack" data-key="thrust">⚔</button><button class="ctrl attack" data-key="bash">🛡</button></div></div>
<div class="hint">電腦：← → 移動　↑ 跳躍　Z 槍刺　X 盾擊　｜　手機直接按按鈕</div>
</div>
<script>
(()=>{const stage=document.getElementById('stage'),p=document.getElementById('player'),en=document.getElementById('enemies'),hp=document.getElementById('hp'),counter=document.getElementById('counter'),msg=document.getElementById('message'),title=document.getElementById('title'),desc=document.getElementById('desc'),start=document.getElementById('start');let x=18,life=100,kills=0,running=false,jump=0,last=0,spawn=0,cd=0,boss=false;const keys={};
function reset(){x=18;life=100;kills=0;running=true;jump=0;spawn=0;cd=0;boss=false;en.innerHTML='';hp.style.width='100%';msg.style.display='none';for(let i=0;i<3;i++)spawnEnemy(48+i*12,false);last=performance.now();requestAnimationFrame(loop)}
function spawnEnemy(pos,isBoss){const e=document.createElement('div');e.className='enemy'+(isBoss?' boss':'');e.dataset.x=pos;e.dataset.hp=isBoss?'8':'2';e.dataset.boss=isBoss?'1':'0';en.appendChild(e)}
function effect(text,px,py){const f=document.createElement('div');f.className='float';f.textContent=text;f.style.left=px+'%';f.style.bottom=(py+30)+'%';stage.appendChild(f);setTimeout(()=>f.remove(),450)}
function attack(kind){if(!running||cd>0)return;cd=kind==='thrust'?260:420;p.classList.add(kind);setTimeout(()=>p.classList.remove(kind),150);const range=kind==='thrust'?10:7;let hit=0;document.querySelectorAll('.enemy').forEach(e=>{if(e.classList.contains('dead'))return;const ex=+e.dataset.x;if(Math.abs(ex-x)<range){const damage=kind==='thrust'?1:2;let eh=+e.dataset.hp-damage;e.dataset.hp=eh;e.classList.add('hit');setTimeout(()=>e.classList.remove('hit'),110);effect(kind==='thrust'?'槍刺!':'盾擊!',ex,18);hit++;if(eh<=0){e.classList.add('dead');kills++;setTimeout(()=>e.remove(),200);if(kills>=10&&!boss){boss=true;spawnEnemy(82,true);effect('BOSS!',82,25)}}}});if(hit>0){const s=document.createElement('div');s.className='slash';s.style.left=(x+3)+'%';s.style.bottom='24%';stage.appendChild(s);setTimeout(()=>s.remove(),230)}}
function update(dt){if(keys.left)x=Math.max(3,x-.32);if(keys.right)x=Math.min(92,x+.32);if(jump>0){jump+=dt*.055;if(jump>=100)jump=0}cd=Math.max(0,cd-dt);p.style.left=x+'%';p.style.bottom=(18+(jump?Math.sin(jump/100*Math.PI)*15:0))+'%';document.querySelectorAll('.enemy').forEach(e=>{if(e.classList.contains('dead'))return;let ex=+e.dataset.x;const speed=e.dataset.boss==='1'?.045:.075;if(Math.abs(ex-x)>4)ex+=Math.sign(x-ex)*speed;else{life=Math.max(0,life-(e.dataset.boss==='1'?.55:.22));hp.style.width=life+'%'}e.dataset.x=ex;e.style.left=ex+'%'});counter.textContent=boss?'BOSS 戰':'敵人 '+kills+' / 10';if(life<=0)finish('聖騎士倒下了','城門仍然在等你。');if(boss&&!document.querySelector('.boss'))finish('通關！','你守住了城門。')}
function loop(t){if(!running)return;const dt=Math.min(50,t-last);last=t;update(dt);requestAnimationFrame(loop)}
function finish(t,d){running=false;title.textContent=t;desc.textContent=d;start.textContent='重新開始';msg.style.display='flex'}
function press(k){if(k==='left'||k==='right')keys[k]=true;else if(k==='jump'&&!jump)jump=1;else if(k==='thrust')attack('thrust');else if(k==='bash')attack('bash')}
function release(k){keys[k]=false}
window.addEventListener('keydown',e=>{if(!running)return;const k=e.key;if(['ArrowLeft','ArrowRight','ArrowUp'].includes(k))e.preventDefault();if(k==='ArrowLeft')press('left');else if(k==='ArrowRight')press('right');else if(k==='ArrowUp')press('jump');else if(k.toLowerCase()==='z')press('thrust');else if(k.toLowerCase()==='x')press('bash')});
window.addEventListener('keyup',e=>{if(e.key==='ArrowLeft')release('left');if(e.key==='ArrowRight')release('right')});
document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();press(k)});b.addEventListener('pointerup',e=>{e.preventDefault();release(k)});b.addEventListener('pointercancel',()=>release(k));b.addEventListener('pointerleave',()=>release(k))});
start.addEventListener('click',reset)})();
</script>
</body>
</html>
